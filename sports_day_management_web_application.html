<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Day Management System 2026</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0b132b] text-slate-100 font-sans selection:bg-cyan-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const Trophy = (props) => <svg {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>;
    const Shield = (props) => <svg {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>;
    const Lock = (props) => <svg {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>;
    const X = (props) => <svg {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
    const ArrowLeft = (props) => <svg {...props} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>;

    function App() {
      const [currentView, setCurrentView] = useState('LANDING');
      const [publicTab, setPublicTab] = useState('HOME');
      const [adminTab, setAdminTab] = useState('MATCHES');
      const [pinInput, setPinInput] = useState('');
      const [loginModalOpen, setLoginModalOpen] = useState(false);
      const [loginError, setLoginError] = useState('');

      const teams = [
        { id: 'blue', name: 'คณะสีฟ้า', text: 'text-cyan-400', gold: 5, silver: 3, bronze: 2 },
        { id: 'orange', name: 'คณะสีแสด', text: 'text-orange-400', gold: 4, silver: 6, bronze: 1 }
      ];

      const matches = [
        { id: 'm1', sport: 'ฟุตบอล 7 คน', status: 'FINISHED', date: '2026-11-01', location: 'สนามหลัก' },
        { id: 'm2', sport: 'บาสเกตบอลชาย', status: 'LIVE', date: '2026-11-01', location: 'โรงยิมเนเซียม' }
      ];

      const handleLogin = (e) => {
        e.preventDefault();
        if (pinInput === '161616') {
          setCurrentView('ADMIN');
          setLoginModalOpen(false);
          setPinInput('');
          setLoginError('');
        } else {
          setLoginError('รหัสผ่าน PIN ไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง');
        }
      };

      return (
        <div className="min-h-screen bg-[#0b132b] text-slate-100 font-sans flex flex-col justify-between selection:bg-cyan-500 selection:text-slate-950">
          {currentView === 'LANDING' && (
            <div className="max-w-4xl mx-auto px-6 py-20 text-center space-y-8 my-auto relative">
              <span className="px-4 py-1.5 rounded-full bg-[#1c2541] border border-cyan-500/30 text-xs font-bold text-cyan-400 shadow-lg">
                ✨ SPORTS DAY 2026 (BLUE & ORANGE ธีม)
              </span>
              <h1 className="text-3xl md:text-6xl font-black bg-gradient-to-r from-cyan-400 via-sky-300 to-orange-400 bg-clip-text text-transparent">
                ระบบจัดการและติดตามผลกีฬาสี 2026
              </h1>
              <p className="text-slate-300 text-sm max-w-xl mx-auto">
                เว็บแอปพลิเคชันจัดการแข่งขันกีฬาสี คณะสีฟ้าและสีแสด โทนสีกลมกลืน สดใส สมูททุกมุมมอง พร้อมเมนูสมบูรณ์ครบถ้วน
              </p>
              <div className="flex flex-wrap justify-center gap-4 pt-4">
                <button 
                  onClick={() => setCurrentView('PUBLIC')}
                  className="px-6 py-3 bg-gradient-to-r from-cyan-500 to-sky-500 hover:from-cyan-400 hover:to-sky-400 text-slate-950 font-black rounded-2xl shadow-lg transition cursor-pointer"
                >
                  📣 เข้าสู่ระบบติดตามผล (ผู้ชม)
                </button>
                <button 
                  onClick={() => setLoginModalOpen(true)}
                  className="px-6 py-3 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-400 hover:to-amber-400 text-slate-950 font-black rounded-2xl shadow-lg transition flex items-center gap-2 cursor-pointer"
                >
                  <Shield className="w-5 h-5" /> เข้าสู่ระบบเจ้าหน้าที่
                </button>
              </div>
            </div>
          )}

          {currentView !== 'LANDING' && (
            <div className="flex-1 flex flex-col md:flex-row">
              <aside className="w-full md:w-64 bg-[#1c2541]/90 border-b md:border-r border-[#3a506b] p-4 space-y-4 shrink-0">
                <div className="flex justify-between items-center">
                  <span className="font-black text-orange-400 text-sm">SPORTS DAY 2026</span>
                  <button onClick={() => setCurrentView('LANDING')} className="text-xs text-slate-300 hover:text-white flex items-center gap-1 cursor-pointer"><ArrowLeft className="w-3.5 h-3.5" /> หน้าแรก</button>
                </div>
                {currentView === 'PUBLIC' && (
                  <div className="space-y-1 text-xs font-bold">
                    <button onClick={() => setPublicTab('HOME')} className={`w-full text-left p-2.5 rounded-xl transition cursor-pointer ${publicTab === 'HOME' ? 'bg-cyan-500 text-slate-950' : 'text-slate-300'}`}>🏠 หน้าแรก</button>
                    <button onClick={() => setPublicTab('SCHEDULE')} className={`w-full text-left p-2.5 rounded-xl transition cursor-pointer ${publicTab === 'SCHEDULE' ? 'bg-cyan-500 text-slate-950' : 'text-slate-300'}`}>📅 ตารางแข่งขัน</button>
                    <button onClick={() => setPublicTab('MEDALS')} className={`w-full text-left p-2.5 rounded-xl transition cursor-pointer ${publicTab === 'MEDALS' ? 'bg-cyan-500 text-slate-950' : 'text-slate-300'}`}>🥇 ตารางเหรียญ</button>
                  </div>
                )}
                {currentView === 'ADMIN' && (
                  <div className="space-y-1 text-xs font-bold">
                    <span className="text-[10px] text-orange-400 px-2 font-black">ADMIN PANEL</span>
                    <button onClick={() => setAdminTab('MATCHES')} className="w-full text-left p-2.5 rounded-xl bg-orange-500 text-slate-950">📅 จัดการการแข่งขัน</button>
                  </div>
                )}
              </aside>

              <main className="flex-1 p-6 overflow-y-auto max-w-5xl">
                {currentView === 'PUBLIC' && (
                  <div className="space-y-6">
                    <h2 className="text-2xl font-black text-cyan-400">ยินดีต้อนรับสู่กีฬาสี 2026</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {teams.map((t, idx) => (
                        <div key={t.id} className="bg-[#1c2541] border border-[#3a506b] p-5 rounded-2xl flex justify-between items-center shadow-lg">
                          <div>
                            <h3 className={`font-black ${t.text}`}>#{idx + 1} {t.name}</h3>
                            <p className="text-xs text-slate-300">ทอง: {t.gold} | เงิน: {t.silver} | ทองแดง: {t.bronze}</p>
                          </div>
                          <span className="text-lg font-black text-white">{t.gold + t.silver + t.bronze} เหรียญ</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                {currentView === 'ADMIN' && (
                  <div className="space-y-6">
                    <h2 className="text-xl font-black text-orange-400">แผงควบคุมเจ้าหน้าที่ (Admin Control Panel)</h2>
                    <p className="text-xs text-slate-300">เข้าสู่ระบบสำเร็จด้วยรหัส PIN เรียบร้อยแล้ว</p>
                  </div>
                )}
              </main>
            </div>
          )}

          {loginModalOpen && (
            <div className="fixed inset-0 bg-[#0b132b]/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-[#1c2541] border border-[#3a506b] p-6 rounded-3xl max-w-sm w-full space-y-4 shadow-2xl relative">
                <button onClick={() => setLoginModalOpen(false)} className="absolute top-4 right-4 text-slate-300 hover:text-white cursor-pointer"><X className="w-5 h-5" /></button>
                <div className="flex items-center gap-2">
                  <div className="p-2 bg-orange-500/10 text-orange-400 rounded-xl"><Lock className="w-5 h-5" /></div>
                  <h3 className="text-lg font-black text-white">เข้าสู่ระบบเจ้าหน้าที่</h3>
                </div>
                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="text-xs text-slate-300 block mb-1">รหัสผ่าน PIN</label>
                    <input
                      type="password"
                      value={pinInput}
                      onChange={(e) => setPinInput(e.target.value)}
                      placeholder="กรอกรหัสผ่าน PIN..."
                      className="w-full bg-[#0b132b] border border-[#3a506b] rounded-xl p-3 text-center text-lg font-bold text-white tracking-widest focus:border-orange-400 focus:outline-none"
                    />
                  </div>
                  {loginError && <p className="text-xs text-rose-400 font-semibold text-center">{loginError}</p>}
                  <button type="submit" className="w-full py-3 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-400 hover:to-amber-400 text-slate-950 font-black rounded-xl text-xs shadow-lg transition cursor-pointer">
                    ยืนยันเข้าสู่ระบบ
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
